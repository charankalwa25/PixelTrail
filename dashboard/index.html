<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelTrail Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: #ffffff;
        }

        .header {
            padding: 24px 40px;
            border-bottom: 1px solid #222b35;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 6px 0 0;
            color: #8b98a5;
        }

        .container {
            padding: 30px 40px;
            max-width: 1300px;
            margin: auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #161d26;
            border: 1px solid #26313d;
            border-radius: 12px;
            padding: 22px;
        }

        .stat-title {
            color: #8b98a5;
            font-size: 14px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            margin-top: 8px;
        }

        .emails {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .email-card {
            background: #161d26;
            border: 1px solid #26313d;
            border-radius: 12px;
            padding: 22px;
        }

        .email-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .subject {
            font-size: 18px;
            font-weight: bold;
        }

        .recipient {
            margin-top: 5px;
            color: #8b98a5;
            font-size: 14px;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .opened {
            background: #123d2b;
            color: #35d492;
        }

        .sent {
            background: #27313d;
            color: #b8c2cc;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .detail {
            background: #0d1319;
            border-radius: 8px;
            padding: 12px;
        }

        .detail-label {
            color: #788592;
            font-size: 12px;
        }

        .detail-value {
            margin-top: 5px;
            font-size: 13px;
        }

        .empty {
            text-align: center;
            padding: 50px;
            color: #8b98a5;
        }

        .refresh {
            margin-bottom: 20px;
            padding: 9px 16px;
            border: 0;
            border-radius: 8px;
            background: #35d492;
            color: #06301f;
            font-weight: bold;
            cursor: pointer;
        }

        .refresh:hover {
            opacity: 0.9;
        }

        @media (max-width: 700px) {
            .container {
                padding: 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .email-top {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>PixelTrail</h1>
        <p>Email Engagement Dashboard</p>
    </div>

   <div class="stats">
    <div class="stat-card">
        <div class="stat-title">📧 Total Emails</div>
        <div class="stat-number" id="totalEmails">0</div>
    </div>

    <div class="stat-card">
        <div class="stat-title">👁 Open Detected</div>
        <div class="stat-number" id="openedEmails">0</div>
    </div>

    <div class="stat-card">
        <div class="stat-title">🔗 Total Clicks</div>
        <div class="stat-number" id="totalClicks">0</div>
    </div>

    <div class="stat-card">
        <div class="stat-title">🟢 Sent</div>
        <div class="stat-number" id="sentEmails">0</div>
    </div>
</div>

        <button class="refresh" onclick="loadEmails()">
            Refresh
        </button>

        <div id="emails" class="emails">
            <div class="empty">
                Loading emails...
            </div>
        </div>

    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        async function loadEmails() {

            const emailsContainer = document.getElementById("emails");

            try {

                const response = await fetch(`${API_URL}/emails`);

                if (!response.ok) {
                    throw new Error("Could not fetch emails");
                }

                const data = await response.json();

                const emails = data.emails || [];

                document.getElementById("totalEmails").textContent =
    emails.length;

document.getElementById("openedEmails").textContent =
    emails.filter(email => email.status === "opened").length;

document.getElementById("totalClicks").textContent =
    emails.reduce(
        (total, email) => total + (email.click_count || 0),
        0
    );

document.getElementById("sentEmails").textContent =
    emails.filter(email => email.status === "sent").length;

                if (emails.length === 0) {
                    emailsContainer.innerHTML = `
                        <div class="empty">
                            No tracked emails yet.
                        </div>
                    `;
                    return;
                }

                emailsContainer.innerHTML = emails.map(email => {

                    const isOpened = email.status === "opened";

                    return `
                        <div class="email-card">

                            <div class="email-top">

                                <div>
                                    <div class="subject">
                                        ${escapeHtml(email.subject || "No subject")}
                                    </div>

                                    <div class="recipient">
                                        ${escapeHtml(email.recipient)}
                                    </div>
                                </div>

                                <div class="status ${isOpened ? "opened" : "sent"}">
                                    ${isOpened ? "👁 Open detected" : "🟢 Sent"}
                                </div>

                            </div>

                            <div class="details">

    <div class="detail">
        <div class="detail-label">
            👁 Open count
        </div>

        <div class="detail-value">
            ${email.open_count}
        </div>
    </div>

    <div class="detail">
        <div class="detail-label">
            First opened
        </div>

        <div class="detail-value">
            ${formatDate(email.first_opened_at)}
        </div>
    </div>

    <div class="detail">
        <div class="detail-label">
            Last opened
        </div>

        <div class="detail-value">
            ${formatDate(email.last_opened_at)}
        </div>
    </div>

    <div class="detail">
        <div class="detail-label">
            🔗 Click count
        </div>

        <div class="detail-value">
            ${email.click_count || 0}
        </div>
    </div>

    <div class="detail">
        <div class="detail-label">
            First clicked
        </div>

        <div class="detail-value">
            ${formatDate(email.first_clicked_at)}
        </div>
    </div>

    <div class="detail">
        <div class="detail-label">
            Last clicked
        </div>

        <div class="detail-value">
            ${formatDate(email.last_clicked_at)}
        </div>
    </div>
    <div class="detail">
    <div class="detail-label">
        ✓ Seen confirmed
    </div>

    <div class="detail-value">
        ${email.confirmed_seen_at
            ? formatDate(email.confirmed_seen_at)
            : "Not confirmed yet"}
    </div>
</div>

</div>

                        </div>
                    `;

                }).join("");

            } catch (error) {

                console.error(error);

                emailsContainer.innerHTML = `
                    <div class="empty">
                        ❌ Could not connect to PixelTrail backend.
                        <br><br>
                        Make sure FastAPI is running.
                    </div>
                `;
            }
        }

       function formatDate(dateString) {

    if (!dateString) {
        return "Not yet";
    }

    return new Date(dateString).toLocaleString();
}
        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        loadEmails();
        setInterval(loadEmails, 5000);
    </script>

</body>
</html>
